<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="splash-section">
            <header>
                <img src="img/logo.png" alt="logo">
                <h1>ODIN</h1>
            </header>
        </section>
        <section class="main-fillout-section">
            <p>
              This is a "very real" online service! Sign up now to get to see more of
              the amazing and "very real" service that we've made for you.
            </p>
            <div class="fillout-section">
                <h2>Let's do this</h2>
                <form action="index.html" method="get" id="form">
                    <div>
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" name="first-name" id="first-name" required />
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email" required />
                        <label for="pasword">PASSWORD</label>
                        <input type="password" name="password" id="password" required />
                    </div>
                    <div>
                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name" id="last-name" required />
                        <label for="number">PHONE NUMBER</label>
                        <input type="number" name="phone" id="phone" required />
                        <label for="confirm-pass">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm-pass" id="confirm-pass" required />
                    </div>
                </form>
                <button type="submit" form="form" value="submit">Submit</button>
            </div>
        </section>
    </main>
</body>
</html>
